name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: gofmt check
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "以下文件未通过 gofmt:"
            echo "$out"
            echo "--- diff ---"
            gofmt -d .
            exit 1
          fi

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go vet ./...
      - name: go test（全文失败输出进 job summary + artifact 双保险）
        # ⚠️ windows runner 的 run: 默认 pwsh——bash 语法(set +e/重定向/$VAR)
        # 第一行就 CommandNotFound 崩（2026-09-13 三轮 windows 假失败的根因）。
        shell: bash
        run: |
          set +e
          go test ./... -race -count=1 -v > /tmp/test.out 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            cp /tmp/test.out test-failure.out
            cat test-failure.out >> "$GITHUB_STEP_SUMMARY"
            exit $code
          fi
      - name: upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-out-${{ matrix.os }}
          path: test-failure.out
          if-no-files-found: ignore
          retention-days: 3
      - name: push failure log to branch（匿名 git fetch 可读，绕过日志权限墙）
        if: failure()
        shell: bash
        run: |
          cp /tmp/test.out test-failure.out
          git config user.email "ci@ghydra.local"
          git config user.name "ci-bot"
          git checkout -B ci-failure-log
          git add -f test-failure.out
          git commit -m "test failure log (run ${{ github.run_id }}, ${{ matrix.os }})"
          git push -f origin ci-failure-log
  api-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: serve 装配冒烟（16 项断言，含 W2 规则地板×4）
        run: sh engine/cmd/ghydra/smoke_w1.sh
      - name: W2 phase 3 毒化矩阵黑盒（refresher×fakesite 7 场景）
        run: sh engine/cmd/ghydra/smoke_w2p3.sh

  # W4：自更新黑盒升级演练（三平台矩阵——swap 的 Windows 文件锁路径
  # 必须在真 Windows 上证明）。真编译 v1.0.0/v1.0.1 两版二进制，
  # releasesrv fake Release server 驱动 正常链/回滚链/投毒拒/daemon 对账。
  selfupdate-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      # 场景拆独立 step：失败步骤名即定位（匿名 jobs API 可读步骤结论，
      # 无需日志权限）。跨 step 状态经 /tmp/w4state.env（同 job VM 共享）。
      - name: setup（双版本构建 + releasesrv）
        shell: bash   # pwsh 坑第 3+1 次：Windows 步骤一律显式 bash
        run: sh scripts/smoke_w4.sh setup
      - name: 场景 A 正常升级链
        shell: bash
        run: sh scripts/smoke_w4.sh scenario-a
      - name: 场景 B 回滚 + bad_version
        shell: bash
        run: sh scripts/smoke_w4.sh scenario-b
      - name: 场景 C 投毒拒
        shell: bash
        run: sh scripts/smoke_w4.sh scenario-c
      - name: 场景 D daemon 对账
        shell: bash
        run: sh scripts/smoke_w4.sh scenario-d
      - name: 失败状态转储推分支（尽力而为）
        if: failure()
        shell: bash
        run: |
          NAME="smoke-w4-fail-${{ matrix.os }}.txt"
          { echo "run ${{ github.run_id }} ${{ matrix.os }}"; cat /tmp/w4state.env 2>/dev/null
            for f in apply.log apply2.log serve.log srv.log rb.log; do
              p="/tmp/w4data."*/"$f"; echo "==== $f ===="; tail -40 $p 2>/dev/null
            done } > "$NAME" || true
          git config user.email "ci@ghydra.local" && git config user.name "ci-bot"
          git checkout -B ci-failure-log
          git add -f "$NAME" || true
          git -c user.email=ci@ghydra.local -c user.name=ci-bot commit -m "smoke_w4 fail (run ${{ github.run_id }}, ${{ matrix.os }})" || true
          git push -f origin ci-failure-log || true
          # 第二通道：gh api PUT（git push 在本 job 三轮未落地，原因未明——
          # 换传输验证是否凭据/传输层问题）
          gh api --method PUT "repos/xueweijian/ghydra/contents/ci-dump-${{ matrix.os }}.txt" \
            -f message="smoke_w4 fail dump run ${{ github.run_id }}" \
            -f content="$(base64 -w0 "$NAME")" || true
      - name: teardown
        if: always()
        shell: bash
        run: sh scripts/smoke_w4.sh teardown

  # W4.5：Windows 平台行为证明（无 Windows 真机期间的开发替代）。
  # 真实跑注册表接管/恢复 + on/off 生命周期 + kill -9 崩溃对账。
  # 注意：这是平台证明，不等于大陆网络下的现场验收（DevWorkflow 三环境分工）。
  windows-integration:
    runs-on: windows-2022 # 固定镜像：runner 升级不漂移集成基线（退役时切 windows-2025）
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: sysproxy 注册表接管/恢复集成测试
        run: go test -tags=integration ./engine/sysproxy/... -run Integration -v -count=1
      - name: ghydra on/off 生命周期 + 崩溃对账集成测试
        run: go test -tags=integration ./engine/cmd/ghydra/ -run Integration -v -count=1

  # W3：Worker 模板验证（沙箱禁 npm，node_modules 只活在 CI）。
  # 纯逻辑测试（依赖全注入）+ 类型检查 + wrangler 配置校验（dry-run 不上传）。
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22" # wrangler 4.131 要求 ≥22（本地沙箱同为 22，版本对齐）
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run dry-run

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: 基准（记录基线，阈值断言于 M1 引入）
        run: go test ./engine/sni/... -bench . -benchmem -run '^$'

  # W4：黑盒故障演练——真实 serve 进程 + fakesite 网络层故障注入，
  # 断言 403/RST 类故障 30s 内切道（M2 退出标准①的进程级证明）。
  drill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: git 集成端到端（真 git clone 经 insteadOf 落到假 CDN）
        run: |
          go vet -tags=integration ./...   # integration 文件默认不编译，防 import 腐烂
          go test -tags=integration ./engine/gitcfg/ -run TestEndToEndCloneRewrite -v -count=1
      - run: bash scripts/drill.sh

  # M3-W2 规则签名链发布纪律（拍板点 #1：本地离线签 + CI 只验不签）
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: schema 校验（与运行时同解析器）
        run: go run ./scripts/sign-rules -check -in rules/current.json
      - name: 第三方独立实现交叉验签（防自证）
        run: go run ./scripts/crosscheck scripts/rules-release.pub rules/current.json.minisig rules/current.json
      - name: 版本单调（规则文件有变更时必须递增）
        run: |
          if git diff --quiet HEAD~1 HEAD -- rules/current.json; then
            echo "规则文件未变更，跳过单调检查"
            exit 0
          fi
          prev=$(git show "HEAD~1:rules/current.json" 2>/dev/null | python3 -c "import json,sys; print(json.load(sys.stdin)['version'])" 2>/dev/null || echo 0)
          curr=$(python3 -c "import json; print(json.load(open('rules/current.json'))['version'])")
          echo "prev=$prev curr=$curr"
          if [ "$curr" -le "$prev" ]; then
            echo "版本倒退：$curr <= $prev"
            exit 1
          fi

  build:
    needs: [fmt, test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - { goos: windows, goarch: amd64, ext: ".exe" }
          - { goos: darwin, goarch: arm64, ext: "" }
          - { goos: darwin, goarch: amd64, ext: "" }
          - { goos: linux, goarch: amd64, ext: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: build
        env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o "dist/ghydra-${GOOS}-${GOARCH}${{ matrix.target.ext }}" ./engine/cmd/ghydra
      - uses: actions/upload-artifact@v4
        with:
          name: ghydra-${{ matrix.target.goos }}-${{ matrix.target.goarch }}
          path: dist/
          if-no-files-found: error

  # v0.5：tag 推送时把四平台 artifact 发布成 GitHub Release。
  # beta 后缀自动打 prerelease 标。
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, drill, worker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref, 'beta') }}
