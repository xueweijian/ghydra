name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25" # go.mod go 1.25（wails v3 要求；toolchain 锁 1.25.0）
      - name: gofmt check
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "以下文件未通过 gofmt:"
            echo "$out"
            echo "--- diff ---"
            gofmt -d .
            exit 1
          fi

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25" # go.mod go 1.25（wails v3 要求；toolchain 锁 1.25.0）
      - run: go vet ./...
      - name: go test（全文失败输出进 job summary + artifact 双保险）
        # ⚠️ windows runner 的 run: 默认 pwsh——bash 语法(set +e/重定向/$VAR)
        # 第一行就 CommandNotFound 崩（2026-09-13 三轮 windows 假失败的根因）。
        shell: bash
        run: |
          set +e
          go test ./... -race -count=1 -v > /tmp/test.out 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            cp /tmp/test.out test-failure.out
            cat test-failure.out >> "$GITHUB_STEP_SUMMARY"
            exit $code
          fi
      - name: upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-out-${{ matrix.os }}
          path: test-failure.out
          if-no-files-found: ignore
          retention-days: 3
      - name: push failure log to branch（匿名 git fetch 可读，绕过日志权限墙）
        if: failure()
        shell: bash
        run: |
          cp /tmp/test.out test-failure.out
          git config user.email "ci@ghydra.local"
          git config user.name "ci-bot"
          git checkout -B ci-failure-log
          git add -f test-failure.out
          git commit -m "test failure log (run ${{ github.run_id }}, ${{ matrix.os }})"
          git push -f origin ci-failure-log
  api-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25" # go.mod go 1.25（wails v3 要求；toolchain 锁 1.25.0）
      - name: serve 装配冒烟（16 项断言，含 W2 规则地板×4）
        run: sh engine/cmd/ghydra/smoke_w1.sh
      - name: W2 phase 3 毒化矩阵黑盒（refresher×fakesite 7 场景）
        run: sh engine/cmd/ghydra/smoke_w2p3.sh
      - name: W4p2 diag 冒烟（zip 结构 + 泄漏扫描零命中）
        run: sh engine/cmd/ghydra/smoke_w4p2_diag.sh

  # W4：自更新黑盒升级演练（三平台矩阵——swap 的 Windows 文件锁路径
  # 必须在真 Windows 上证明）。真编译 v1.0.0/v1.0.1 两版二进制，
  # releasesrv fake Release server 驱动 正常链/回滚链/投毒拒/daemon 对账。
  selfupdate-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25" # go.mod go 1.25（wails v3 要求；toolchain 锁 1.25.0）
      # 场景拆独立 step：失败步骤名即定位（匿名 jobs API 可读步骤结论，
      # 无需日志权限）。跨 step 状态经 /tmp/w4state.env（同 job VM 共享）。
      - name: setup（双版本构建 + releasesrv）
        shell: bash   # pwsh 坑第 3+1 次：Windows 步骤一律显式 bash
        run: sh scripts/smoke_w4.sh setup
      - name: 场景 A 正常升级链
        shell: bash
        run: sh scripts/smoke_w4.sh scenario-a
      - name: 场景 B 回滚 + bad_version
        shell: bash
        run: sh scripts/smoke_w4.sh scenario-b
      - name: 场景 C 投毒拒
        shell: bash
        run: sh scripts/smoke_w4.sh scenario-c
      - name: 场景 D daemon 对账
        shell: bash
        run: sh scripts/smoke_w4.sh scenario-d
      - name: teardown（w4）
        if: always()
        shell: bash
        run: sh scripts/smoke_w4.sh teardown
      - name: 失败状态转储（gh api 第二通道，脚本内已有 git 通道）
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NAME="smoke-w4-fail-${{ matrix.os }}.txt"
          { echo "run ${{ github.run_id }} ${{ matrix.os }}"; cat /tmp/w4state.env 2>/dev/null
            for f in apply.log apply2.log serve.log srv.log rb.log; do
              p="/tmp/w4data."*/"$f"; echo "==== $f ===="; tail -40 $p 2>/dev/null
            done } > "$NAME" || true
          gh api --method PUT "repos/xueweijian/ghydra/contents/ci-dump-${{ matrix.os }}.txt" \
            -f message="smoke_w4 fail dump run ${{ github.run_id }}" \
            -f content="$(base64 -w0 "$NAME")" || true
      # W4p2 P4：GUI 壳依赖的生产路径——serve 内 apply 两段式全链 +
      # config 持久化跨重启 + version 提示行。独立脚本独立状态文件，
      # 端口 19721 与 smoke_w4（19711）错开。
      - name: setup（w4p4 双版本 + releasesrv）
        shell: bash
        run: sh scripts/smoke_w4p2_p4.sh setup
      - name: 场景 A serve 内 apply 两段式全链
        shell: bash
        run: sh scripts/smoke_w4p2_p4.sh scenario-a
      - name: 场景 B config 持久化跨重启
        shell: bash
        run: sh scripts/smoke_w4p2_p4.sh scenario-b
      - name: 场景 C version 提示行
        shell: bash
        run: sh scripts/smoke_w4p2_p4.sh scenario-c
      - name: teardown（w4p4）
        if: always()
        shell: bash
        run: sh scripts/smoke_w4p2_p4.sh teardown

  # W4.5：Windows 平台行为证明（无 Windows 真机期间的开发替代）。
  # 真实跑注册表接管/恢复 + on/off 生命周期 + kill -9 崩溃对账。
  # 注意：这是平台证明，不等于大陆网络下的现场验收（DevWorkflow 三环境分工）。
  windows-integration:
    runs-on: windows-2022 # 固定镜像：runner 升级不漂移集成基线（退役时切 windows-2025）
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25" # go.mod go 1.25（wails v3 要求；toolchain 锁 1.25.0）
      - name: sysproxy 注册表接管/恢复集成测试
        run: go test -tags=integration ./engine/sysproxy/... -run Integration -v -count=1
      - name: ghydra on/off 生命周期 + 崩溃对账集成测试
        run: go test -tags=integration ./engine/cmd/ghydra/ -run Integration -v -count=1

  # F1 L3：NSIS 安装器 PATH 全生命周期断言（四轮验收现象 2 的 CI 化）。
  # /S 静默装 → HKLM PATH 含 GHydra + App Paths 键 → 新进程解析 ghydra →
  # 卸载 → PATH 条目精确消失。gui exe 用 stub dist 构建即可（PATH 测试
  # 不开面板；index.html 断言属 release.yml 职责）。
  nsis-path:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: NSIS 红线静态断言
        run: sh scripts/check-nsi.sh
      - name: 构建 gui 变体（stub dist 足够）
        env:
          CGO_ENABLED: "0"
        run: go build -tags "gui production" -trimpath -ldflags "-s -w -X main.Version=0.0.0-ci" -o packaging/windows/ghydra.exe ./engine/cmd/ghydra
      - name: makensis（EnVar 插件已 vendor）
        run: |
          makensis -V2 packaging/windows/ghydra.nsi
          test -f ghydra-windows-amd64-setup.exe
      - name: /S 静默安装 + PATH/AppPaths 断言
        run: |
          ./ghydra-windows-amd64-setup.exe /S
          sleep 3
          reg query "HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Environment" /v Path | grep -i "GHydra" || { echo "FAIL: HKLM PATH 无 GHydra"; exit 1; }
          reg query "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\App Paths\ghydra.exe" >/dev/null || { echo "FAIL: App Paths 键缺失"; exit 1; }
      - name: 全新进程解析 ghydra（广播后新 PATH）
        run: |
          powershell -NoProfile -Command '$env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User"); (Get-Command ghydra -ErrorAction Stop).Source' | grep -i ghydra
          "/c/Program Files/GHydra/ghydra.exe" version | head -1
      - name: 卸载 + 三清零断言（PATH 条目/App Paths/目录）
        run: |
          "/c/Program Files/GHydra/uninstall.exe" /S
          sleep 3
          if reg query "HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Environment" /v Path | grep -i "GHydra"; then echo "FAIL: PATH 残留"; exit 1; fi
          if reg query "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\App Paths\ghydra.exe" >/dev/null 2>&1; then echo "FAIL: App Paths 残留"; exit 1; fi
          test ! -d "/c/Program Files/GHydra" || { echo "FAIL: 目录残留"; exit 1; }

  # W3：Worker 模板验证（沙箱禁 npm，node_modules 只活在 CI）。
  # 纯逻辑测试（依赖全注入）+ 类型检查 + wrangler 配置校验（dry-run 不上传）。
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22" # wrangler 4.131 要求 ≥22（本地沙箱同为 22，版本对齐）
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run dry-run

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25" # go.mod go 1.25（wails v3 要求；toolchain 锁 1.25.0）
      - name: 基准（记录基线，阈值断言于 M1 引入）
        run: go test ./engine/sni/... -bench . -benchmem -run '^$'

  # W4：黑盒故障演练——真实 serve 进程 + fakesite 网络层故障注入，
  # 断言 403/RST 类故障 30s 内切道（M2 退出标准①的进程级证明）。
  drill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25" # go.mod go 1.25（wails v3 要求；toolchain 锁 1.25.0）
      - name: git 集成端到端（真 git clone 经 insteadOf 落到假 CDN）
        run: |
          go vet -tags=integration ./...   # integration 文件默认不编译，防 import 腐烂
          go test -tags=integration ./engine/gitcfg/ -run TestEndToEndCloneRewrite -v -count=1
      - run: bash scripts/drill.sh

  # M3-W2 规则签名链发布纪律（拍板点 #1：本地离线签 + CI 只验不签）
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25" # go.mod go 1.25（wails v3 要求；toolchain 锁 1.25.0）
      - name: schema 校验（与运行时同解析器）
        run: go run ./scripts/sign-rules -check -in rules/current.json
      - name: 第三方独立实现交叉验签（防自证）
        run: go run ./scripts/crosscheck scripts/rules-release.pub rules/current.json.minisig rules/current.json
      - name: 版本单调（规则文件有变更时必须递增）
        run: |
          if git diff --quiet HEAD~1 HEAD -- rules/current.json; then
            echo "规则文件未变更，跳过单调检查"
            exit 0
          fi
          prev=$(git show "HEAD~1:rules/current.json" 2>/dev/null | python3 -c "import json,sys; print(json.load(sys.stdin)['version'])" 2>/dev/null || echo 0)
          curr=$(python3 -c "import json; print(json.load(open('rules/current.json'))['version'])")
          echo "prev=$prev curr=$curr"
          if [ "$curr" -le "$prev" ]; then
            echo "版本倒退：$curr <= $prev"
            exit 1
          fi

  build:
    needs: [fmt, test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - { goos: windows, goarch: amd64, ext: ".exe" }
          - { goos: darwin, goarch: arm64, ext: "" }
          - { goos: darwin, goarch: amd64, ext: "" }
          - { goos: linux, goarch: amd64, ext: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25" # go.mod go 1.25（wails v3 要求；toolchain 锁 1.25.0）
      - name: build（CLI 变体）
        env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w -X main.Version=ci-${GITHUB_SHA:0:7}" -o "dist/ghydra-${GOOS}-${GOARCH}${{ matrix.target.ext }}" ./engine/cmd/ghydra
      - name: 验证 ldflags 版本注入（linux 产物可本机运行，D2 注入链路）
        if: matrix.target.goos == 'linux'
        run: |
          v=$(./dist/ghydra-linux-amd64 version | head -1)
          echo "version 输出: $v"
          echo "$v" | grep -q "ci-" || { echo "FAIL: ldflags -X main.Version 未生效"; exit 1; }
      - name: build（gui 变体冒烟——windows CGO=0 交叉编译；darwin/linux gui 变体见 ci-gui/P3）
        if: matrix.target.goos == 'windows'
        env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
          CGO_ENABLED: "0"
        run: |
          # dist/.gitkeep（已入库）保证 //go:embed all:frontend/dist 在无 npm 产物时可编译（D1）
          go build -tags gui -trimpath -ldflags="-s -w -X main.Version=ci-${GITHUB_SHA:0:7}" -o "dist/ghydra-${GOOS}-${GOARCH}-gui${{ matrix.target.ext }}" ./engine/cmd/ghydra
      - uses: actions/upload-artifact@v4
        with:
          name: ghydra-${{ matrix.target.goos }}-${{ matrix.target.goarch }}
          path: dist/
          if-no-files-found: error

  # （W4p2 P3 起 tag 出包全权归 release.yml——此处旧 release job 已移除：
  #  裸二进制 release 与 draft release 同 tag 冲突，selfupdate tags 端点
  #  只见 published 的旧格式，SelectAsset 拿不到 checksums.txt）
